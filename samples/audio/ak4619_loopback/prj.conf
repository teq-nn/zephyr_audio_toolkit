# The control bus. CONFIG_I2C is selected by CONFIG_AK4619, which the codec
# node in dts/boards/nucleo_h723zg.overlay turns on by itself, so nothing here
# has to name either - that the driver carries its own dependency is part of
# what makes it movable into drivers/audio/ later.

# Console-visible result. The driver logs the outcome of its write/read/verify
# at INFO; src/main.c prints the verdict with printk() so it survives a build
# with logging turned down.
CONFIG_LOG=y

# Nothing from the audio pipeline is enabled yet: issue #45 is the codec
# skeleton, and the tone path arrives with #47. CONFIG_AUDIO_PIPELINE stays off
# so this image proves the codec and only the codec.
