# The control bus. CONFIG_I2C is selected by CONFIG_AK4619, which the codec
# node in dts/boards/nucleo_h723zg.overlay turns on by itself, so nothing here
# has to name either - that the driver carries its own dependency is part of
# what makes it movable into drivers/audio/ later.

# Console-visible result. The driver and the pipeline nodes log at INFO;
# src/main.c prints the verdict with printk() so it survives a build with
# logging turned down.
CONFIG_LOG=y

# The two pipelines. CONFIG_I2S arrives through the two I2S node symbols, the
# same way CONFIG_I2C arrives through CONFIG_AK4619: a node's dependency
# belongs to the node's symbol.
#
#   tone_gen -> i2s_out        the stimulus, on the block that drives the clocks
#   i2s_in   -> tone_analyzer  the measurement, on the block that follows them
#
# Nothing else is enabled: a node is only reachable through its *_NODE_DEFINE()
# macro, so these four lines are the whole node set of this image.
CONFIG_AUDIO_PIPELINE=y
CONFIG_AUDIO_PIPELINE_NODE_TONE_GEN=y
CONFIG_AUDIO_PIPELINE_NODE_I2S_OUT=y
CONFIG_AUDIO_PIPELINE_NODE_I2S_IN=y
CONFIG_AUDIO_PIPELINE_NODE_TONE_ANALYZER=y

# Both pipelines are AUDIO_PIPELINE_DEFINE()d and bring their own stack, frame
# buffer and event slots, so CONFIG_AUDIO_PIPELINE_FRAME_SAMPLES sizes only the
# built-in buffer that neither of them claims. Left at its default rather than
# tuned, because tuning it would suggest it mattered here; the figure that does
# is FRAME_SAMPLES in src/main.c, which sizes both frame buffers and both sets
# of transfer blocks.

# The three levels audio_codec_configure() programs - DAC digital volume, ADC
# digital volume and the analog MIC gain - are left at their Kconfig defaults
# on purpose. Those defaults *are* the set #43 §4.5 records, and the pass window
# in src/loopback_format.h is derived from the same symbols - so overriding one
# here would move the measurement and the expectation together, which is right,
# while putting the number in two places, which is not.

# The slot length is a choice rather than a setting: see Kconfig.loopback. The
# default is 32-bit slots. If a run reports energy with no tone in it, rebuild
# with -DCONFIG_AK4619_LOOPBACK_SLOT_16=y; README.md says why.
