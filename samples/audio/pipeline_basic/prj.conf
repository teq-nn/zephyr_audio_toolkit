CONFIG_AUDIO_PIPELINE=y

# The file reader source needs a mounted filesystem. ext2 on a RAM disk keeps
# the sample self-contained: both are in-tree Zephyr code, so no extra west
# module is needed and the sample runs headless on native_sim. The RAM disk is
# declared in app.overlay.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_EXT2=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y

# ext2_format() seeds the filesystem UUID from sys_rand_get().
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=4096
