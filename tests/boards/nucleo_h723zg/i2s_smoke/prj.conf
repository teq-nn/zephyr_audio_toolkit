CONFIG_ZTEST=y

# The I2S subsystem plus the two blocks the overlay enables. CONFIG_I2S_STM32
# turns itself on from DT_HAS_ST_STM32_I2S_ENABLED and selects DMA, PINCTRL
# and CACHE_MANAGEMENT, so none of those are spelled out here.
CONFIG_I2S=y

# The DIX4192 control port. i2c1 is already enabled by nucleo_h723zg.dts on
# PB8/PB9 (the Arduino I2C pins); only the subsystem needs switching on.
CONFIG_I2C=y

# Build the audio pipeline into the image as well. The module has never been
# compiled for a real board, and a board target that does not exercise it
# would not notice the day it stops cross-compiling.
CONFIG_AUDIO_PIPELINE=y
