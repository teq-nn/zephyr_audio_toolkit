CONFIG_ZTEST=y

# The pipeline plus exactly one node: the sink under test. CONFIG_I2S is not
# spelled out because AUDIO_PIPELINE_NODE_I2S_OUT selects it - that the node
# carries its own dependency is part of what this suite proves - and
# CONFIG_I2S_STM32 turns itself on from DT_HAS_ST_STM32_I2S_ENABLED.
CONFIG_AUDIO_PIPELINE=y
CONFIG_AUDIO_PIPELINE_NODE_I2S_OUT=y
