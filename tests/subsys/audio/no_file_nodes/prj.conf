CONFIG_ZTEST=y
CONFIG_AUDIO_PIPELINE=y

# The point of the suite: the two nodes it uses, and deliberately neither file
# node. FILE_SYSTEM is selected by AUDIO_PIPELINE_NODE_FILE_READER and
# AUDIO_PIPELINE_NODE_FILE_WRITER and by nothing else in this module, so the
# generated .config for this application must come out with CONFIG_FILE_SYSTEM
# unset - which test_no_file_nodes.c asserts against the generated autoconf.h
# rather than against the Kconfig source.
CONFIG_AUDIO_PIPELINE_NODE_GAIN_FILTER=y
CONFIG_AUDIO_PIPELINE_NODE_NULL_SINK=y
