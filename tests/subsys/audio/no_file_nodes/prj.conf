CONFIG_ZTEST=y
CONFIG_AUDIO_PIPELINE=y

# The point of the suite: the two nodes it uses, and deliberately neither file
# node and neither I2S node. FILE_SYSTEM is selected by
# AUDIO_PIPELINE_NODE_FILE_READER and AUDIO_PIPELINE_NODE_FILE_WRITER, and I2S
# by AUDIO_PIPELINE_NODE_I2S_IN and AUDIO_PIPELINE_NODE_I2S_OUT, and by nothing
# else in this module - so the generated .config for this application must come
# out with both CONFIG_FILE_SYSTEM and CONFIG_I2S unset, which
# test_no_file_nodes.c asserts against the generated autoconf.h rather than
# against the Kconfig source.
CONFIG_AUDIO_PIPELINE_NODE_GAIN_FILTER=y
CONFIG_AUDIO_PIPELINE_NODE_NULL_SINK=y
