CONFIG_ZTEST=y

# The wire seam is part of the pipeline core, like the WAV header codec, so no
# node symbol and no I2S driver is needed here. That is deliberate: the seam is
# shared by the I2S sink and the I2S source, and hardware neither of them can
# reach on this platform must not be in the way of testing the arithmetic they
# share.
CONFIG_AUDIO_PIPELINE=y
