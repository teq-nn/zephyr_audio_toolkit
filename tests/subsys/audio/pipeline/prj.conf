CONFIG_ZTEST=y
CONFIG_AUDIO_PIPELINE=y

# Fixture filesystem for the file node suites: ext2 on a RAM disk. Both are
# in-tree Zephyr code, so no extra west module is required (see wav_fixture.h).
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_EXT2=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
# ext2_format() seeds the filesystem UUID from sys_rand_get().
CONFIG_TEST_RANDOM_GENERATOR=y

# ext2 formats and walks its metadata on the calling thread.
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
