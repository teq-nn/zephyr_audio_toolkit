CONFIG_ZTEST=y
CONFIG_AUDIO_PIPELINE=y

# This suite exercises every shipped node, so it enables them all. Node
# symbols default to n; the no_file_nodes suite next door covers the other
# end of that range, where the file nodes are off and FILE_SYSTEM stays out.
CONFIG_AUDIO_PIPELINE_NODE_FILE_READER=y
CONFIG_AUDIO_PIPELINE_NODE_FILE_WRITER=y
CONFIG_AUDIO_PIPELINE_NODE_GAIN_FILTER=y
CONFIG_AUDIO_PIPELINE_NODE_NULL_SINK=y
CONFIG_AUDIO_PIPELINE_NODE_TONE_ANALYZER=y
CONFIG_AUDIO_PIPELINE_NODE_TONE_GEN=y

# Fixture filesystem for the file node suites: ext2 on a RAM disk. Both are
# in-tree Zephyr code, so no extra west module is required (see wav_fixture.h).
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_EXT2=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_RAM=y
# ext2_format() seeds the filesystem UUID from sys_rand_get().
CONFIG_TEST_RANDOM_GENERATOR=y

# Size the ext2 block cache to the blocks that are actually on the disk. The
# cache is a single static array of CONFIG_EXT2_MAX_BLOCK_SIZE multiplied by
# CONFIG_EXT2_MAX_BLOCK_COUNT bytes (__ext2_block_memory_buffer), and the
# 4096-byte default reserves four times the space a cached block can ever
# occupy here: FS_EXT2_DECLARE_DEFAULT_CONFIG in include/zephyr/fs/ext2.h
# formats at 1024 bytes per block, and nothing in this fixture overrides it. On
# native_sim the 40 KiB that buys nothing is invisible; on the nucleo_h723zg
# cross-build CI now runs it is 12% of everything the board has. See issue #48,
# and app.overlay for the matching argument about the disk itself.
CONFIG_EXT2_MAX_BLOCK_SIZE=1024

# ext2 formats and walks its metadata on the calling thread.
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
