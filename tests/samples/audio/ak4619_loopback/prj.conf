CONFIG_ZTEST=y

# CONFIG_I2C arrives through CONFIG_AK4619, which the codec nodes in
# app.overlay turn on by themselves. What has to be named here is the emulated
# bus and the emulator framework the suite's stand-in part is built on: there
# is no I2C peripheral on native_sim, and the point of the suite is that there
# does not need to be one.
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y

# The driver's diagnostics are part of what this ticket delivers, so build them
# and let them run - the absent-part case logs its checklist during suite
# start-up, which is a readable record of the failure path in the Twister log.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# The absent part at 0x11 never answers, and its initialisation polls until it
# gives up. 20 ms keeps that bounded: two attempts on top of the datasheet's
# mandatory 10 ms settling wait, which is enough to exercise the retry without
# adding a visible pause to every run.
CONFIG_AK4619_PROBE_TIMEOUT_MS=20
