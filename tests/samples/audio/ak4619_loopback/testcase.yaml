# The codec driver on a host, against an emulated part. There is no
# platform_allow: the whole point is that the suite needs neither an I2C
# peripheral nor an evaluation board, so it runs wherever the rest of
# scripts/ci-test.sh does. The suite lives under tests/samples/ because the
# code it covers lives under samples/ - the driver ships with the sample, not
# with the toolkit (issue #42).
tests:
  audio.samples.ak4619_loopback:
    tags:
      - audio
      - codec
      - i2c
    integration_platforms:
      - native_sim
